name: Calculation regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install docassemble runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
      - run: python -m pip install PyYAML docassemble.base
      - run: python -m unittest discover -s tests -v
